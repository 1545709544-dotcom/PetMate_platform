<!-- UI Interaction Script -->
<script>
        function switchTab(type) {
            const smsTab = document.getElementById('tab-sms');
            const pwdTab = document.getElementById('tab-pwd');
            const smsSec = document.getElementById('sms-section');
            const pwdSec = document.getElementById('pwd-section');

            if (type === 'sms') {
                smsTab.classList.add('active-tab');
                smsTab.classList.remove('text-on-surface-variant');
                pwdTab.classList.remove('active-tab');
                pwdTab.classList.add('text-on-surface-variant');
                smsSec.classList.remove('hidden');
                pwdSec.classList.add('hidden');
            } else {
                pwdTab.classList.add('active-tab');
                pwdTab.classList.remove('text-on-surface-variant');
                smsTab.classList.remove('active-tab');
                smsTab.classList.add('text-on-surface-variant');
                pwdSec.classList.remove('hidden');
                smsSec.classList.add('hidden');
            }
        }
    </script>
