<!-- Micro-interactions Script -->
<script>
        function togglePassword() {
            const pwdInput = document.getElementById('password');
            const toggleBtn = event.currentTarget;
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                toggleBtn.textContent = 'visibility_off';
            } else {
                pwdInput.type = 'password';
                toggleBtn.textContent = 'visibility';
            }
        }

        // Form submission animation/feedback
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = this.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = '<span class="animate-spin material-symbols-outlined">progress_activity</span> 正在验证...';
            
            // Simulating API call
            setTimeout(() => {
                btn.classList.replace('bg-primary-container', 'bg-success-green');
                btn.classList.replace('text-on-primary-container', 'text-white');
                btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> 欢迎回来！';
                
                setTimeout(() => {
                    btn.disabled = false;
                    btn.innerHTML = originalContent;
                    btn.classList.replace('bg-success-green', 'bg-primary-container');
                    btn.classList.replace('text-white', 'text-on-primary-container');
                }, 1500);
            }, 2000);
        });

        // Simple parallax effect for the left background
        document.addEventListener('mousemove', (e) => {
            const leftSection = document.querySelector('.lg\\:w-7\\/12');
            if (!leftSection) return;
            
            const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
            const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
            
            const bgImage = leftSection.querySelector('div[style*="background-image"]');
            bgImage.style.transform = `scale(1.1) translate(${moveX}px, ${moveY}px)`;
        });
    </script>
