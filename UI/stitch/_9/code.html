<script>
        // Micro-interactions for pet selector
        document.querySelectorAll('.flex-shrink-0').forEach(item => {
            item.addEventListener('click', function() {
                // Remove active states
                document.querySelectorAll('.flex-shrink-0').forEach(p => {
                    p.classList.add('opacity-60');
                    p.classList.remove('opacity-100');
                    p.querySelector('div').classList.remove('border-primary-container', 'ring-4', 'ring-primary-fixed/30');
                    p.querySelector('div').classList.add('border-outline-variant');
                    p.querySelector('span').classList.remove('font-bold', 'text-primary-container');
                    p.querySelector('span').classList.add('text-on-surface-variant');
                });
                // Set current as active
                this.classList.remove('opacity-60');
                this.classList.add('opacity-100');
                this.querySelector('div').classList.add('border-primary-container', 'ring-4', 'ring-primary-fixed/30');
                this.querySelector('div').classList.remove('border-outline-variant');
                this.querySelector('span').classList.add('font-bold', 'text-primary-container');
                this.querySelector('span').classList.remove('text-on-surface-variant');
            });
        });
    </script>
